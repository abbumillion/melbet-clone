services:
  postgres:
    image: postgres:16-alpine
    container_name: melbet-postgres
    environment:
      POSTGRES_DB: melbet
      POSTGRES_USER: melbet_user
      POSTGRES_PASSWORD: melbet_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melbet_user -d melbet"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: melbet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
