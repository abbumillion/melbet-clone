spring.application.name=melbet-backend
# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/melbet
spring.datasource.username=melbet_user
spring.datasource.password=melbet_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# App-specific
app.jwt.secret=change-this-to-a-long-random-secret-key-at-least-256-bits-long-please
app.jwt.expiration-ms=86400000
app.email.verification-expiry-minutes=15
